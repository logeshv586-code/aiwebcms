name: Finalize AI Web CMS source

on:
  push:
    paths:
      - '.final-stage/READY'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore audited source
        shell: bash
        run: |
          set -euo pipefail
          {
            for part in 001 002 003 004 005 006; do
              git show f080f57e2abfd2acd9604a8a7f1748884db200b3:.import-source/chunk-${part}.b64
            done
          } | tr -d '\n\r' | base64 -d > /tmp/original.zip
          unzip -t /tmp/original.zip >/dev/null
          rm -rf /tmp/source-import
          mkdir -p /tmp/source-import
          unzip -q /tmp/original.zip -d /tmp/source-import
          if [ -d /tmp/source-import/src ]; then
            SOURCE=/tmp/source-import/src
          else
            SOURCE=/tmp/source-import
          fi
          rsync -a --delete --exclude='.git' --exclude='.final-stage' "$SOURCE/" ./

      - name: Apply premium non-destructive motion layer
        shell: bash
        run: |
          set -euo pipefail
          cat .final-stage/patch-*.b64 | tr -d '\n\r' | base64 -d | gzip -d > /tmp/premium.patch
          git apply /tmp/premium.patch
          mkdir -p docs/images
          cat .final-stage/image-*.b64 | tr -d '\n\r' | base64 -d > docs/images/cms-dashboard.webp
          rm -rf .final-stage .import-source .import-xz .premium-stage
          git diff --check

      - name: Publish complete application to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'feat: publish premium non-destructive storefront motion'
          git push origin HEAD:main
